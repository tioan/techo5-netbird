name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: CGO_ENABLED=0 go vet ./... && CGO_ENABLED=0 GOARCH=arm64 go vet ./... && CGO_ENABLED=0 GOARCH=arm GOARM=7 go vet ./...
      - name: test
        run: CGO_ENABLED=0 go test -count=1 ./...
      - name: build arm and arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w" -o techo5-netbird-arm .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o techo5-netbird-arm64 .
      - name: installer tests
        run: python3 -m unittest discover -s tools -v
