name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: CGO_ENABLED=0 go test -count=1 ./...
      - name: addon.json names this version
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(python3 -c 'import json; print(json.load(open("addon.json"))["version"])')
          test "$got" = "$want" || { echo "addon.json says $got, the tag $want"; exit 1; }
      - name: build
        run: |
          mkdir dist
          # arm is the build TECHO5's add-on catalog gives every device (TECHO5's own programs are 32-bit);
          # arm64 is the one an install by hand uses. Both run NetBird's linux_arm64 client.
          for arch in arm arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=7 go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/techo5-netbird-$arch" .
          done
          cp addon.json dist/
          cd dist && sha256sum techo5-netbird-arm techo5-netbird-arm64 addon.json > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/techo5-netbird-arm
            dist/techo5-netbird-arm64
            dist/addon.json
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's section of CHANGELOG.md, without its heading; a prerelease without one of its
          # own takes [Unreleased].
          section() {
            awk -v v="$1" '
              /^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next }
              on && !/^\[[^]]*\]: /' CHANGELOG.md
          }
          section "$version" > dist/notes.md
          pre=
          case "$version" in *-*) pre=--prerelease; test -s dist/notes.md || section Unreleased > dist/notes.md ;; esac
          test -s dist/notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          client=$(grep -o 'clientVersion = "[^"]*"' client.go | cut -d'"' -f2)
          fence=$(printf '\140\140\140')
          printf '\nPins NetBird client %s (linux_arm64). SHA-256:\n\n%s\n%s\n%s\n' "$client" "$fence" "$(cat dist/SHA256SUMS)" "$fence" >> dist/notes.md
          gh release create "$GITHUB_REF_NAME" $pre dist/techo5-netbird-arm dist/techo5-netbird-arm64 \
            dist/addon.json dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
